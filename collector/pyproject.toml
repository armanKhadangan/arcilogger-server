[project]
name = "arcilogger-collector"
dynamic = ["version"]
description = "ARCILOGGER syslog collector: receives syslog (UDP/TCP 514, TLS 6514) and writes every message unchanged to the raw spool before anything else happens."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["arcilogger-core"]

[project.scripts]
arcilogger-collector = "arcilogger_collector.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcilogger_collector"]

[tool.hatch.version]
path = "src/arcilogger_collector/__init__.py"
