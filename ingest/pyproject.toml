[project]
name = "arcilogger-ingest"
dynamic = ["version"]
description = "ARCILOGGER ingest: tails the raw spool, parses FortiGate / MikroTik / generic syslog and loads normalised rows into PostgreSQL."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["arcilogger-core", "arcilogger-db"]

[project.scripts]
arcilogger-ingest = "arcilogger_ingest.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcilogger_ingest"]

[tool.hatch.version]
path = "src/arcilogger_ingest/__init__.py"
