# Development only. The production server runs on Windows without Docker
# (see docs/ARCHITECTURE.md). Ports are bound to 127.0.0.1.
#
#   docker compose -f deploy/dev/compose.yaml up -d
#
name: arcilogger-dev

services:
  db:
    image: timescale/timescaledb:2.30.2-pg16
    environment:
      POSTGRES_DB: arcilogger
      POSTGRES_USER: arcilogger
      POSTGRES_PASSWORD: ${ARCI_DEV_DB_PASSWORD:-arcilogger-dev-only}
      TZ: UTC
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arcilogger -d arcilogger']
      interval: 5s
      timeout: 3s
      retries: 20

  mail:
    # Catches the report e-mails in development: http://127.0.0.1:8025
    image: axllent/mailpit:v1.31.5
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  db-data:
