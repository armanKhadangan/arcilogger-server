# ARCILOGGER configuration — copy to C:\ProgramData\ARCILOGGER\arcilogger.toml and adjust.
# The installer makes that file from this one on a first installation and writes into it what
# belongs to the organisation: site_name (-SiteName), data_dir (-DataRoot), [collector] bind
# (-ServerAddress) and [clock] ntp_server (-NtpServer). It configures NO log source: the
# [[sources]] below are commented-out examples. Add those of your own devices and run the
# installer again (its firewall opens 514 only for them). An existing arcilogger.toml is never
# replaced (an upgrade changes only a given -SiteName / -NtpServer line).
# Secrets (Kamu SM customer number and password, database password) do NOT belong here:
#   arcilogger-core secret init
#   arcilogger-core secret set kamusm.customer
#   arcilogger-core secret set kamusm.password
#   arcilogger-core secret set database.password

site_name = ""                 # the organisation's name (reports, e-mails); required: -SiteName
data_dir = "D:/ARCILOGGER"
# secrets_dir defaults to the folder of this file (C:\ProgramData\ARCILOGGER)

# --- Log sources. One sender IP = one source name. ----------------------------------------
# A new installation has NO source (kaynak YOK). Until you add yours, the firewall opens 514 to
# no sender and nothing is recorded; without the firewall step (-SkipFirewall) every sender is
# recorded as "unknown-<ip>" (parser chosen by content, alert "new log source") and no source is
# watched for silence (R15). Add one [[sources]] table for every device that sends syslog, at
# least the firewall and the core router (the DHCP server), with the address it sends from.
# Then run the installer again (it applies the firewall and restarts the services), or
# Set-ArciFirewall.ps1 and Restart-Service ArciCollector, ArciIngest, ArciApi, ArciWorker
# (docs/DEVICE-SETUP.md section 4). `arcilogger-core config-check` warns while there is none.
#   name              lower-case letters, digits and "-": the spool folder ("unknown-" is reserved)
#   type              "fortigate" | "mikrotik" | "generic": selects the parser
#   address           the sender's IP address, or a network such as "10.0.7.0/24" for devices
#                     with DHCP addresses: each sender in it becomes its own "<name>-<ip>"
#   heartbeat_minutes R15 alert after this long without a message (default 15)
#   expected          false: not expected every day (no gap in the manifest, no R15)
#   transport         "any" (default) | "udp" | "tcp": UDP sender addresses can be forged inside
#                     the LAN. Once a device sends over TCP 514, set "tcp": UDP datagrams claiming
#                     its address are then dropped, counted and alerted (wrong-transport).
#                     Recommended for the firewall and the core router (docs/DEVICE-SETUP.md 1.1).
#
# EXAMPLE (ÖRNEK): the devices of the documentation's fictional example network: a firewall, the
# core router (the DHCP server) and a switch. Remove the "#" at the start of the lines of the
# devices you have and write their names and addresses; lines that start with "# " stay comments.
#[[sources]]
#name = "fortigate"
#type = "fortigate"
#address = "172.31.255.1"      # example: the firewall
#heartbeat_minutes = 10
## transport = "tcp"           # after "set mode reliable" (TCP 514 open)
#
#[[sources]]
#name = "core-r1"
#type = "mikrotik"
#address = "172.20.10.1"       # example: the core router (check the address it sends from)
#heartbeat_minutes = 15
## transport = "tcp"           # after remote-protocol=tcp (if RouterOS supports it)
#
#[[sources]]
#name = "switch-1"
#type = "mikrotik"
#address = "172.20.10.21"      # example: a switch (its management address)

[collector]
bind = "0.0.0.0"               # the installer writes the server address here (-ServerAddress)
udp_port = 514
tcp_port = 514
unknown_senders = "write"      # "write" (unknown-<ip> + alert) or "drop"

[seal]
gzip_level = 9
gap_minutes = 60
retry_minutes = [5, 15, 60, 180, 360]
late_after_hours = 48
# first_day = 2026-11-01       # first day of the chain before the first seal (default: oldest
#                              # spool day); once days are sealed it can only move the start forward
max_consecutive_empty_days = 7 # longer runs without any log are not stamped day by day: a critical
#                              # alert, and the next sealed day's manifest lists them in its gaps

[tsa]
# Start with the Kamu SM TEST server; switch to production after the connection test:
#   provider = "zamane", url = "http://zd.kamusm.gov.tr"  -> Kamu SM production server
provider = "zamane"
url = "http://tzd.kamusm.gov.tr"
port = 80
digest = "sha256"
java = ["C:/Program Files/Eclipse Adoptium/jre-8/bin/java.exe"]
zamane_jar = "C:/ProgramData/ARCILOGGER/zamane/tss-client-console-3.1.33.jar"
zamane_verify_flag = "-CC"
credit_alert_threshold = 500
roots_dir = "C:/ProgramData/ARCILOGGER/kamusm-roots"
# SHA-256 fingerprints of the Kamu SM roots, compared with Kamu SM's published values; a day is
# shown as legal grade only when its stamp chains to one of them (empty: no day is).
legal_root_fingerprints = []
# require_critical_eku = false # only if Kamu SM's TSA certificate marks its EKU non-critical (K6)

[retention]
enabled = false                # keep everything during the first two years
days = 760                     # minimum 730

[replica]
enabled = false
target = "//<NAS>/arcilogger-worm"   # a share on a NAS or another server (placeholder)
# user = '<NAS>\arcireplica'   # share user; password: arcilogger-core secret set replica.password

[clock]
# The local time source, usually the core router (the installer asks for it: -NtpServer).
# Empty: Windows Time and the hourly clock check use only fallback_server.
ntp_server = ""
fallback_server = "time.ume.tubitak.gov.tr"
alert_offset_ms = 1000

# --- Database (ingest, worker, API — never needed by the evidence jobs above) ---------------
[database]
host = "127.0.0.1"
port = 5432
name = "arcilogger"
user = "arcilogger"
# sslmode = "disable"         # libpq sslmode; the server is local
timescale = "auto"             # "auto" (use TimescaleDB if installed), "require" or "off"
# The password is in the secret store: arcilogger-core secret set database.password
# Schema: arcilogger-db upgrade   (the installer runs it on every install/upgrade)

[api]
# Caddy (HTTPS, port 443 of the server address) forwards /api to host:port. After changing
# either, run the installer again (it writes Caddy's upstream, its health check and port probe
# from here).
# Caddy connects from host itself, so forwarded_allow_ips must cover it (host = "::1" needs
# "127.0.0.1,::1"); otherwise every request would be recorded with the server's own address
# (audit log, sessions, login limits). The installer's preflight refuses that.
host = "127.0.0.1"
port = 8000
secure_cookies = true
forwarded_allow_ips = "127.0.0.1"

[ingest]
batch_rows = 5000              # spec 7.2: COPY every 5,000 rows or 500 ms
batch_seconds = 0.5
poll_seconds = 0.5
workers = 2                    # parse processes (0-16; 0 = in the service process); docs/INGEST.md

[worker]
interval_seconds = 60          # spec 9.1: incremental lease timeline every minute

# --- Scheduled database backup (area B, ADR-0009; task \ARCILOGGER\Backup, daily 01:40) -----
# pg_dump as the ARCILOGGER role (password from the secret store), checked with pg_restore --list;
# state in D:\ARCILOGGER\state\backup\last.json, alert R20-backup on failure (docs/YEDEKLEME.md).
# Copy the dumps off the server: they lie on the same disk as the database.
[backup]
enabled = true
dir = "backups/scheduled"      # relative to data_dir; the installer sets the rights on this folder
keep_daily = 14                # keep the newest dump of each of the last 14 days ...
keep_weekly = 8                # ... of the last 8 ISO weeks ...
keep_monthly = 12              # ... and of the last 12 months
pg_dump = ""                   # empty: bin folder of the PostgreSQL service, then PATH
pg_restore = ""
min_free_gb = 10               # refused below 10 GB free + the size of the newest dump

# --- Area E: alert e-mail (docs/ALERTS.md). Who gets which alerts is a database setting ---------
# (alerts.email_recipients, alerts.email_min_severity, ...). The password is in the secret store:
#   arcilogger-core secret set smtp.password
# Test: arcilogger-worker alerts test-email --to <address>. Strict outbound firewall: the
# installer's Set-ArciFirewall.ps1 allows this host and port itself (when enabled = true).
[smtp]
enabled = false                # true once host, from_address (and the password) are set
# host = "<SMTP server>"
port = 587                     # 587 + "starttls", or 465 + "ssl"; the certificate is always verified
security = "starttls"          # "starttls" | "ssl" | "none" (plain text: a relay on this server only)
# username = "<user>"          # remove when the server needs no authentication
# from_address = "<sender address>"
timeout_seconds = 30
# ca_file = 'C:\ProgramData\ARCILOGGER\smtp-ca.pem'   # a company CA; default: the system store
