name: CI

# #157's diagnostic dispatch (a draft pull request that is never merged; closed and its branch
# deleted after the runs). Only the two perf jobs' setup and the live-tail guard, three times in a
# row: I157_SLOW=1 is today's code; I157_SLOW=1.2 makes the event loop burn 0.2 times the CPU it
# spent outside the hub's cycles at each cycle start (tools/diag/i157slow.py, loaded with
# -p i157slow), twice. Each run prints its gauge, event-loop and per-line-check lines; the summary
# step names each run's result. The job fails only if unchanged code failed.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA, as on the integration branches.
jobs:
  python-linux:
    name: Python (ubuntu-latest, PostgreSQL 16 + TimescaleDB) - I157 live-tail slowdown diagnostic
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as deploy/dev/compose.yaml. Throwaway CI credentials, not a secret.
        image: timescale/timescaledb:2.30.2-pg16
        env:
          POSTGRES_USER: arci_test
          POSTGRES_PASSWORD: arci_test
          POSTGRES_DB: postgres
          TIMESCALEDB_TELEMETRY: 'off'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arci_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --shm-size 1g
    env:
      ARCILOGGER_TEST_PG: postgresql://arci_test:arci_test@127.0.0.1:5432/postgres
      ARCILOGGER_REQUIRE_DB: '1'
      ARCILOGGER_EXPECT_TIMESCALE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install workspace
        run: uv sync --locked --all-packages
      - name: Quiet the database server log
        run: >-
          psql "$ARCILOGGER_TEST_PG" -v ON_ERROR_STOP=1
          -c "ALTER SYSTEM SET log_checkpoints = off"
          -c "ALTER SYSTEM SET log_min_messages = fatal"
          -c "ALTER SYSTEM SET log_min_error_statement = panic"
          -c "SELECT pg_reload_conf()"
      - name: "I157 run 1 of 3 - unchanged code (I157_SLOW=1)"
        id: none
        continue-on-error: true
        env:
          I157_SLOW: '1'
          PYTHONPATH: tools/diag
        run: >-
          uv run pytest -m perf --no-cov -p no:cacheprovider -p i157slow -s
          api/tests/test_live_perf.py -k test_three_streams_under_ten_thousand_lines_a_second
          2>&1 | tee i157-none.log
      - name: "I157 run 2 of 3 - event loop x1.2 (I157_SLOW=1.2)"
        id: slow1
        continue-on-error: true
        env:
          I157_SLOW: '1.2'
          PYTHONPATH: tools/diag
        run: >-
          uv run pytest -m perf --no-cov -p no:cacheprovider -p i157slow -s
          api/tests/test_live_perf.py -k test_three_streams_under_ten_thousand_lines_a_second
          2>&1 | tee i157-slow1.log
      - name: "I157 run 3 of 3 - event loop x1.2 again (I157_SLOW=1.2)"
        id: slow2
        continue-on-error: true
        env:
          I157_SLOW: '1.2'
          PYTHONPATH: tools/diag
        run: >-
          uv run pytest -m perf --no-cov -p no:cacheprovider -p i157slow -s
          api/tests/test_live_perf.py -k test_three_streams_under_ten_thousand_lines_a_second
          2>&1 | tee i157-slow2.log
      - name: I157 summary (unchanged code must pass; the x1.2 runs are reported)
        if: always()
        env:
          NONE: ${{ steps.none.outcome }}
          SLOW1: ${{ steps.slow1.outcome }}
          SLOW2: ${{ steps.slow2.outcome }}
        run: |
          status=0
          for run in none slow1 slow2; do
            case $run in
              none) outcome=$NONE ;;
              slow1) outcome=$SLOW1 ;;
              slow2) outcome=$SLOW2 ;;
            esac
            if [ "$run" = none ] && [ "$outcome" != success ]; then status=1; fi
            echo "I157 SUMMARY $run: test $outcome"
            grep -aE 'gauge:|event loop:|per-line check:|\[i157slow\]' "i157-$run.log" | tr -d '\r' | sed "s/^/I157 $run: /"
          done
          {
            echo '```'
            for run in none slow1 slow2; do
              grep -aE 'gauge:|event loop:|per-line check:|\[i157slow\]' "i157-$run.log" | tr -d '\r' | sed "s/^/$run: /"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  python-windows-perf:
    name: Python (windows-latest, PostgreSQL) - I157 live-tail slowdown diagnostic
    runs-on: windows-latest
    env:
      ARCILOGGER_REQUIRE_DB: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
          enable-cache: true
      # Passes ARCILOGGER_TEST_PG to the later steps.
      - name: Start the PostgreSQL preinstalled on the runner image
        shell: pwsh
        run: ./tools/ci/start-windows-postgres.ps1
      - name: Install workspace
        run: uv sync --locked --all-packages
      - name: "I157 run 1 of 3 - unchanged code (I157_SLOW=1)"
        id: none
        continue-on-error: true
        env:
          I157_SLOW: '1'
          PYTHONPATH: tools/diag
        run: >-
          uv run pytest -m perf --no-cov -p no:cacheprovider -p i157slow -s
          api/tests/test_live_perf.py -k test_three_streams_under_ten_thousand_lines_a_second
          2>&1 | tee i157-none.log
      - name: "I157 run 2 of 3 - event loop x1.2 (I157_SLOW=1.2)"
        id: slow1
        continue-on-error: true
        env:
          I157_SLOW: '1.2'
          PYTHONPATH: tools/diag
        run: >-
          uv run pytest -m perf --no-cov -p no:cacheprovider -p i157slow -s
          api/tests/test_live_perf.py -k test_three_streams_under_ten_thousand_lines_a_second
          2>&1 | tee i157-slow1.log
      - name: "I157 run 3 of 3 - event loop x1.2 again (I157_SLOW=1.2)"
        id: slow2
        continue-on-error: true
        env:
          I157_SLOW: '1.2'
          PYTHONPATH: tools/diag
        run: >-
          uv run pytest -m perf --no-cov -p no:cacheprovider -p i157slow -s
          api/tests/test_live_perf.py -k test_three_streams_under_ten_thousand_lines_a_second
          2>&1 | tee i157-slow2.log
      - name: I157 summary (unchanged code must pass; the x1.2 runs are reported)
        if: always()
        env:
          NONE: ${{ steps.none.outcome }}
          SLOW1: ${{ steps.slow1.outcome }}
          SLOW2: ${{ steps.slow2.outcome }}
        run: |
          status=0
          for run in none slow1 slow2; do
            case $run in
              none) outcome=$NONE ;;
              slow1) outcome=$SLOW1 ;;
              slow2) outcome=$SLOW2 ;;
            esac
            if [ "$run" = none ] && [ "$outcome" != success ]; then status=1; fi
            echo "I157 SUMMARY $run: test $outcome"
            grep -aE 'gauge:|event loop:|per-line check:|\[i157slow\]' "i157-$run.log" | tr -d '\r' | sed "s/^/I157 $run: /"
          done
          {
            echo '```'
            for run in none slow1 slow2; do
              grep -aE 'gauge:|event loop:|per-line check:|\[i157slow\]' "i157-$run.log" | tr -d '\r' | sed "s/^/$run: /"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
