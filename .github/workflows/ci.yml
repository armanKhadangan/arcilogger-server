name: CI

# #125's diagnostic dispatch (a draft pull request that is never merged; closed and its branch
# deleted after the runs). Only the two perf jobs' setup and the live-tail guard, three times in a
# row: I125_PROBE=none is today's code, plus40 spins 0.4 times run 1's loop CPU a delivered line
# before each frame, plus400 spins #31's 400 us. Each run prints an "I125:" block; the summary
# step names each run's result and fails the job if unchanged code failed or a probe passed.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA, as on the integration branches.
jobs:
  python-linux:
    name: Python (ubuntu-latest, PostgreSQL 16 + TimescaleDB) - I125 live-tail diagnostic
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as deploy/dev/compose.yaml. Throwaway CI credentials, not a secret.
        image: timescale/timescaledb:2.30.2-pg16
        env:
          POSTGRES_USER: arci_test
          POSTGRES_PASSWORD: arci_test
          POSTGRES_DB: postgres
          TIMESCALEDB_TELEMETRY: 'off'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arci_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --shm-size 1g
    env:
      ARCILOGGER_TEST_PG: postgresql://arci_test:arci_test@127.0.0.1:5432/postgres
      ARCILOGGER_REQUIRE_DB: '1'
      ARCILOGGER_EXPECT_TIMESCALE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install workspace
        run: uv sync --locked --all-packages
      - name: Quiet the database server log
        run: >-
          psql "$ARCILOGGER_TEST_PG" -v ON_ERROR_STOP=1
          -c "ALTER SYSTEM SET log_checkpoints = off"
          -c "ALTER SYSTEM SET log_min_messages = fatal"
          -c "ALTER SYSTEM SET log_min_error_statement = panic"
          -c "SELECT pg_reload_conf()"
      - name: Calibration file for plus40 (written by run 1)
        run: echo "I125_CALIBRATION=$RUNNER_TEMP/i125-calibration.json" >> "$GITHUB_ENV"
      - name: "I125 run 1 of 3 - unchanged code (I125_PROBE=none)"
        id: none
        continue-on-error: true
        env:
          I125_PROBE: none
        run: >-
          uv run pytest -m perf --no-cov -p no:cacheprovider -s api/tests/test_live_perf.py
          2>&1 | tee i125-none.log
      - name: "I125 run 2 of 3 - +40 % of run 1's path (I125_PROBE=plus40)"
        id: plus40
        continue-on-error: true
        env:
          I125_PROBE: plus40
        run: >-
          uv run pytest -m perf --no-cov -p no:cacheprovider -s api/tests/test_live_perf.py
          2>&1 | tee i125-plus40.log
      - name: "I125 run 3 of 3 - #31's +400 us (I125_PROBE=plus400)"
        id: plus400
        continue-on-error: true
        env:
          I125_PROBE: plus400
        run: >-
          uv run pytest -m perf --no-cov -p no:cacheprovider -s api/tests/test_live_perf.py
          2>&1 | tee i125-plus400.log
      - name: I125 summary (expected - none passes, plus40 and plus400 fail)
        if: always()
        env:
          NONE: ${{ steps.none.outcome }}
          PLUS40: ${{ steps.plus40.outcome }}
          PLUS400: ${{ steps.plus400.outcome }}
        run: |
          status=0
          for run in none plus40 plus400; do
            case $run in
              none) outcome=$NONE want=success ;;
              plus40) outcome=$PLUS40 want=failure ;;
              plus400) outcome=$PLUS400 want=failure ;;
            esac
            verdict=EXPECTED
            if [ "$outcome" != "$want" ]; then verdict=UNEXPECTED; status=1; fi
            result=$(grep -a '^I125 RESULT' "i125-$run.log" 2>/dev/null | tail -n 1 | tr -d '\r' || true)
            echo "I125 SUMMARY $run: test $outcome (expected $want), $verdict; ${result:-no I125 RESULT line}"
          done
          {
            echo '```'
            grep -ah '^I125' i125-none.log i125-plus40.log i125-plus400.log 2>/dev/null | tr -d '\r' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  python-windows-perf:
    name: Python (windows-latest, PostgreSQL) - I125 live-tail diagnostic
    runs-on: windows-latest
    env:
      ARCILOGGER_REQUIRE_DB: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
          enable-cache: true
      # Passes ARCILOGGER_TEST_PG to the later steps.
      - name: Start the PostgreSQL preinstalled on the runner image
        shell: pwsh
        run: ./tools/ci/start-windows-postgres.ps1
      - name: Install workspace
        run: uv sync --locked --all-packages
      - name: Calibration file for plus40 (written by run 1)
        run: echo "I125_CALIBRATION=$RUNNER_TEMP/i125-calibration.json" >> "$GITHUB_ENV"
      - name: "I125 run 1 of 3 - unchanged code (I125_PROBE=none)"
        id: none
        continue-on-error: true
        env:
          I125_PROBE: none
        run: >-
          uv run pytest -m perf --no-cov -p no:cacheprovider -s api/tests/test_live_perf.py
          2>&1 | tee i125-none.log
      - name: "I125 run 2 of 3 - +40 % of run 1's path (I125_PROBE=plus40)"
        id: plus40
        continue-on-error: true
        env:
          I125_PROBE: plus40
        run: >-
          uv run pytest -m perf --no-cov -p no:cacheprovider -s api/tests/test_live_perf.py
          2>&1 | tee i125-plus40.log
      - name: "I125 run 3 of 3 - #31's +400 us (I125_PROBE=plus400)"
        id: plus400
        continue-on-error: true
        env:
          I125_PROBE: plus400
        run: >-
          uv run pytest -m perf --no-cov -p no:cacheprovider -s api/tests/test_live_perf.py
          2>&1 | tee i125-plus400.log
      - name: I125 summary (expected - none passes, plus40 and plus400 fail)
        if: always()
        env:
          NONE: ${{ steps.none.outcome }}
          PLUS40: ${{ steps.plus40.outcome }}
          PLUS400: ${{ steps.plus400.outcome }}
        run: |
          status=0
          for run in none plus40 plus400; do
            case $run in
              none) outcome=$NONE want=success ;;
              plus40) outcome=$PLUS40 want=failure ;;
              plus400) outcome=$PLUS400 want=failure ;;
            esac
            verdict=EXPECTED
            if [ "$outcome" != "$want" ]; then verdict=UNEXPECTED; status=1; fi
            result=$(grep -a '^I125 RESULT' "i125-$run.log" 2>/dev/null | tail -n 1 | tr -d '\r' || true)
            echo "I125 SUMMARY $run: test $outcome (expected $want), $verdict; ${result:-no I125 RESULT line}"
          done
          {
            echo '```'
            grep -ah '^I125' i125-none.log i125-plus40.log i125-plus400.log 2>/dev/null | tr -d '\r' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
